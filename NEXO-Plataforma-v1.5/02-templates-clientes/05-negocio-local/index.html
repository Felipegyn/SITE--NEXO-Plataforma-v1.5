<style>

.info{position:absolute;left:14px;bottom:14px;right:14px;background:color-mix(in srgb,var(--sf) 92%,transparent);backdrop-filter:blur(8px);border-radius:16px;padding:14px 18px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 18px;font-size:14px}

.chips button:hover{border-color:var(--ac)}.chips button[aria-pressed=true]{background:var(--ac);color:var(--on);border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:48px}.two>*{min-width:0}
.hr{display:grid;margin:18px 0}.hr div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--ln)}.hr span{color:var(--mut)}
.pts{display:grid;gap:20px}.pts div{border-left:2px solid var(--ac);padding-left:18px}.pts b{display:block;font:700 19px "Bricolage Grotesque",sans-serif}.pts span{color:var(--mut)}
form{display:grid;gap:14px;background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:26px}label{font-size:14px;color:var(--mut);display:grid;gap:6px}
.note{font-size:14px;color:var(--mut)}
details{border-bottom:1px solid var(--ln);padding:18px 0}summary{cursor:pointer;font:700 19px "Bricolage Grotesque",sans-serif;list-style:none;display:flex;justify-content:space-between;gap:16px}
summary::-webkit-details-marker{display:none}summary:after{content:"+";color:var(--ac);font-size:24px;line-height:1}details[open] summary:after{content:"–"}details p{color:var(--mut);margin-top:10px;max-width:62ch}
footer{border-top:1px solid var(--ln);padding:34px 0 44px;color:var(--mut);font-size:15px}footer .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between}
dialog{border:0;border-radius:22px;padding:0;width:min(500px,calc(100% - 32px));max-height:88vh;background:var(--sf);color:var(--fg);box-shadow:0 20px 70px #0005}dialog::backdrop{background:#0008}
.dg{padding:26px;display:grid;gap:12px}.dg h3{font-size:28px}.dg .x{justify-self:end;background:none;border:1px solid var(--ln);border-radius:50%;width:38px;height:38px;cursor:pointer;color:var(--fg);font-size:16px}
.mono{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;background:var(--tint);color:var(--ac);font:800 20px "Bricolage Grotesque",sans-serif}
.wa{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;box-shadow:0 8px 28px #0005}
@media(max-width:900px){#mb{display:block}nav{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;align-items:flex-start;gap:0;background:var(--bg);border-bottom:1px solid var(--ln);padding:10px 20px 20px}nav.open{display:flex}nav a{padding:12px 0;width:100%}nav .btn{width:auto}.hero,.two{grid-template-columns:1fr;gap:34px}.hero{padding:40px 0}section{padding:62px 0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
.art{position:absolute;inset:0;background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 50%,#000));display:grid;place-items:center}.art span{font:800 clamp(120px,20vw,220px)/1 "Bricolage Grotesque",sans-serif;color:#ffffff2e}.art[hidden],.ph img[hidden]{display:none}
.ur{background:var(--ac);color:var(--on)}.ur .wrap{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;padding:10px 0;font-weight:700}.ur .btn{background:var(--on);color:var(--ac);padding:10px 18px}
.pto{background:var(--tint);border:1px solid var(--ac);border-radius:18px;padding:18px 22px;margin-bottom:8px;display:flex;gap:12px;align-items:center}.pto b{color:var(--ac)}
.its{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.it{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:18px 20px;display:flex;justify-content:space-between;gap:16px;align-items:center;transition:border-color .2s}.it:hover{border-color:var(--ac)}
.it h3{font-size:19px}.it p{color:var(--mut);font-size:15px;margin-top:2px}.it .rt{display:grid;gap:8px;justify-items:end;flex:none}.pc{font-weight:700;color:var(--ac);white-space:nowrap}.it .btn{padding:9px 14px;font-size:14px}
.cnt{background:var(--on);color:var(--ac);border-radius:999px;min-width:22px;height:22px;display:inline-grid;place-items:center;font-size:13px;padding:0 6px}
.li{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 0;border-bottom:1px solid var(--ln);align-items:center}.li small{color:var(--mut)}.qt{display:flex;align-items:center;gap:8px}.qt button{width:34px;height:34px;border-radius:50%;border:1px solid var(--ln);background:none;cursor:pointer;color:var(--fg);font-size:18px}.tot{display:flex;justify-content:space-between;font-weight:700;font-size:18px;padding-top:8px}
#demo{position:sticky;top:0;z-index:40;background:#16161a;color:#fff;padding:8px 0;font-size:14px}#demo .wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center}#demo select{width:auto;min-height:38px;padding:6px 12px;background:#2b2b31;color:#fff;border-color:#444}
body.dm header{top:54px}
@media(max-width:900px){.its{grid-template-columns:1fr}body.dm header{top:96px}}

</style></head><body>
<div id="demo" hidden><div class="wrap"><label for="seg" style="color:#fff;display:inline">Demonstração · veja o mesmo site para cada segmento:</label><select id="seg" aria-label="Escolher segmento"></select></div></div>
<div class="ur" id="ur" hidden><div class="wrap"><span id="ut"></span><a class="btn" id="ub" target="_blank" rel="noopener noreferrer" href="#"></a></div></div>
<header><div class="wrap"><a class="brand" href="#topo" id="bn">Negócio</a><button id="mb" aria-label="Abrir menu" aria-expanded="false" aria-controls="nav">☰</button><nav id="nav" aria-label="Principal"></nav></div></header>
<main>
<div class="wrap hero" id="topo"><div><p id="rt" style="font-weight:700;color:var(--ac);letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px"></p><h1 id="h1"></h1><p class="lead" id="sl"></p><div class="acts"><a class="btn" href="#itens" id="c1">Ver</a><a class="btn ghost" id="w1" target="_blank" rel="noopener noreferrer" href="#">Falar no WhatsApp</a></div></div>
<div class="ph"><img id="im" alt="" width="800" height="560" hidden><div class="art" id="ar" aria-hidden="true"><span id="am"></span></div><div class="info" id="inf"></div></div></div>
<div class="wrap" id="pt" hidden><div class="pto"><b>Onde estou hoje:</b><span id="ptx"></span></div></div>
<section id="itens"><div class="wrap"><div class="head"><h2 id="it"></h2><p id="is"></p></div><div class="chips" id="cats" role="group" aria-label="Categorias"></div><div class="its" id="gr"></div></div></section>
<section id="sobre"><div class="wrap two"><div class="head" style="margin:0"><h2>Sobre</h2><p id="sb"></p></div><div class="pts" id="df"></div></div></section>
<section id="contato"><div class="wrap two"><div id="vis"><div class="head" style="margin:0"><h2>Onde estamos</h2></div><p id="ad" style="margin-top:14px;font-size:18px"></p><div class="hr" id="hr"></div><p style="margin-top:16px"><a class="btn ghost" id="mp" target="_blank" rel="noopener noreferrer" href="#">Abrir no Google Maps</a> <a class="btn ghost" id="ig" target="_blank" rel="noopener noreferrer" href="#" hidden>Instagram</a></p></div>
<div><div class="head" style="margin:0 0 20px"><h2 id="ft"></h2><p id="fs"></p></div><form id="f" novalidate></form></div></div></section>
</main>
<footer><div class="wrap"><span id="fc"></span><span>Site criado pela <a href="https://wa.me/5581997488294" target="_blank" rel="noopener noreferrer">NEXO</a> · Ideias conectadas. Soluções em movimento.</span></div><div class="wrap"><p class="note" id="av" hidden></p></div></footer>
<a class="btn wa" id="wa" target="_blank" rel="noopener noreferrer" href="#">WhatsApp</a><dialog id="dlg"></dialog>
<script src="config.js"></script>
<script>
let G,C,cat='',lista={};
const $=id=>document.getElementById(id);
const e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wa=(t,n)=>'https://wa.me/'+(n||G.whatsapp)+'?text='+encodeURIComponent(t);
const brl=v=>typeof v==='number'?v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}):'Sob consulta';
function base(){const R=document.documentElement.style;R.setProperty('--ac',G.cor);R.setProperty('--on',G.corSobre);R.setProperty('--tint','color-mix(in srgb,'+G.cor+' 12%,white)');
$('bn').textContent=G.nome;if(G.imagemTopo){$('im').hidden=false;$('im').src=G.imagemTopo;if($('ar'))$('ar').hidden=true}else{$('im').hidden=true;if($('ar')){$('ar').hidden=false;$('am').textContent=G.nome[0]}}$('hr').innerHTML=G.horarios.map(h=>'<div><b>'+e(h[0])+'</b><span>'+e(h[1])+'</span></div>').join('');
$('ad').textContent=G.endereco+' · '+G.cidade;$('mp').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(G.mapaBusca);
$('fc').textContent='© '+new Date().getFullYear()+' '+G.nome;$('wa').href=wa('Olá! Vim pelo site '+G.nome+'.');
$('mb').onclick=()=>{const o=$('nav').classList.toggle('open');$('mb').setAttribute('aria-expanded',o)};$('nav').querySelectorAll('a').forEach(a=>a.onclick=()=>$('nav').classList.remove('open'));
$('dlg').addEventListener('click',ev=>{if(ev.target===$('dlg'))$('dlg').close()})}
function dlg(h){$('dlg').innerHTML='<div class="dg"><button class="x" aria-label="Fechar" onclick="document.getElementById(\'dlg\').close()">✕</button>'+h+'</div>';$('dlg').showModal()}

const hasP=typeof PRESETS!=='undefined';
function render(c){C=c;G=c.negocio;cat='';lista={};base();const ped=C.pedido;
document.title=G.nome+' | '+G.rotulo;$('h1').innerHTML=e(G.nome).replace(/^(\S+)/,'$1 <span>')+'</span>';$('sl').textContent=G.slogan;$('rt').textContent=G.rotulo;$('sb').textContent=G.sobre;
$('c1').textContent='Ver '+C.itensTitulo.toLowerCase();$('w1').href=wa('Olá! Vim pelo site da '+G.nome+' e gostaria de atendimento.');
$('inf').innerHTML='<div><b>Endereço</b>'+e(G.endereco)+'</div><div><b>Horário</b>'+e(G.horarios[0][0])+': '+e(G.horarios[0][1])+'</div>';
$('pt').hidden=!G.pontoHoje;if(G.pontoHoje)$('ptx').textContent=G.pontoHoje;
$('ur').hidden=!C.urgencia;if(C.urgencia){$('ut').textContent=C.urgencia.texto;$('ub').textContent=C.urgencia.botao;$('ub').href=wa(C.urgencia.mensagem)}
$('it').textContent=C.itensTitulo;$('is').textContent=C.itensSub;
$('df').innerHTML=C.diferenciais.map(d=>'<div><b>'+e(d[0])+'</b><span>'+e(d[1])+'</span></div>').join('');
$('ig').hidden=!G.instagram;if(G.instagram)$('ig').href=G.instagram;
const av=G.aviso||C.aviso;$('av').hidden=!av;if(av)$('av').textContent=av;
$('nav').innerHTML='<a href="#itens">'+e(C.itensTitulo)+'</a><a href="#sobre">Sobre</a><a href="#contato">Contato</a>'+(ped?'<button class="btn" id="lb" type="button">'+e(ped.rotulo)+' <span class="cnt" id="ct">0</span></button>':'<a class="btn" href="#contato">'+e(C.formulario.titulo)+'</a>');
$('nav').querySelectorAll('a').forEach(a=>a.onclick=()=>$('nav').classList.remove('open'));if(ped)$('lb').onclick=()=>{$('nav').classList.remove('open');showList()};
chips();draw();form()}
function chips(){const g=[...new Set(C.itens.map(i=>i.grupo))];$('cats').hidden=g.length<2;$('cats').innerHTML=['Todos',...g].map(x=>'<button type="button" aria-pressed="'+((x==='Todos'&&!cat)||x===cat)+'" data-c="'+e(x)+'">'+e(x)+'</button>').join('');
$('cats').querySelectorAll('button').forEach(b=>b.onclick=()=>{cat=b.dataset.c==='Todos'?'':b.dataset.c;chips();draw()})}
const pr=i=>typeof i.preco==='number'?(i.de?'a partir de ':'')+brl(i.preco):'Sob consulta';
function draw(){const r=C.itens.map((i,k)=>[i,k]).filter(([i])=>!cat||i.grupo===cat);
$('gr').innerHTML=r.map(([i,k])=>'<article class="it"><div><h3>'+e(i.nome)+'</h3>'+(i.detalhe?'<p>'+e(i.detalhe)+'</p>':'')+'</div><div class="rt"><span class="pc">'+pr(i)+'</span>'+(C.pedido?'<button class="btn ghost" data-a="'+k+'" type="button">+ Adicionar</button>':'')+'</div></article>').join('');
$('gr').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{lista[b.dataset.a]=(lista[b.dataset.a]||0)+1;cnt();b.textContent='Adicionado ✓'})}
function cnt(){const n=Object.values(lista).reduce((a,b)=>a+b,0);if($('ct'))$('ct').textContent=n}
function linhas(){return Object.keys(lista).filter(k=>lista[k]>0)}
function msgLista(ks){let t=0;const l=ks.map(k=>{const i=C.itens[k];if(typeof i.preco==='number')t+=i.preco*lista[k];return '- '+lista[k]+'x '+i.nome+' ('+pr(i)+')'}).join('\n');return {l,t}}
function showList(){const ks=linhas(),P=C.pedido;if(!ks.length){dlg('<h3>'+e(P.rotulo)+'</h3><p class="note">Ainda vazio. Use "+ Adicionar" nos itens.</p>');return}
let t=0,sem=false;const rows=ks.map(k=>{const i=C.itens[k],q=lista[k];if(typeof i.preco==='number')t+=i.preco*q;else sem=true;return '<div class="li"><div><b>'+e(i.nome)+'</b><br><small>'+pr(i)+'</small></div><div class="qt"><button data-m="'+k+'" aria-label="Diminuir">−</button><span>'+q+'</span><button data-p="'+k+'" aria-label="Aumentar">+</button></div></div>'}).join('');
dlg('<h3>'+e(P.rotulo)+'</h3>'+rows+'<div class="tot"><span>Total estimado</span><span>'+brl(t)+'</span></div>'+(sem?'<p class="note">Itens sob consulta não entram no total.</p>':'')+'<p class="note">Preços e disponibilidade são confirmados pelo estabelecimento.</p><a class="btn" id="env" target="_blank" rel="noopener noreferrer" href="#">'+e(P.acao)+'</a>');
$('env').href=wa('Olá! '+P.verbo+':\n'+msgLista(ks).l+'\nTotal estimado: '+brl(t));
$('dlg').querySelectorAll('[data-m],[data-p]').forEach(b=>b.onclick=()=>{const k=b.dataset.m||b.dataset.p;lista[k]=Math.max(0,lista[k]+(b.dataset.p?1:-1));cnt();showList()})}
function form(){const Fm=C.formulario,d=new Date(),p=x=>String(x).padStart(2,'0'),min=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
$('ft').textContent=Fm.titulo;$('fs').textContent=Fm.sub;
$('f').innerHTML=Fm.campos.map(c=>{const id='c_'+c.id,r=c.obrigatorio?' *':'';let el;
if(c.tipo==='select')el='<select id="'+id+'">'+c.opcoes.map(o=>'<option>'+e(o)+'</option>').join('')+'</select>';
else if(c.tipo==='longo')el='<textarea id="'+id+'" rows="3"></textarea>';
else if(c.tipo==='data')el='<input id="'+id+'" type="date" min="'+min+'">';
else if(c.tipo==='numero')el='<input id="'+id+'" type="number" min="1" inputmode="numeric">';
else el='<input id="'+id+'" autocomplete="off">';return '<label>'+e(c.rotulo)+r+el+'</label>'}).join('')+'<button class="btn" type="submit">'+e(Fm.botao)+'</button><p class="note" id="st" role="status" aria-live="polite">Nenhum dado fica guardado neste site.</p>';
$('f').onsubmit=ev=>{ev.preventDefault();const v={};for(const c of Fm.campos){v[c.id]=$('c_'+c.id).value.trim();if(c.obrigatorio&&!v[c.id]){$('st').textContent='Preencha: '+c.rotulo+'.';return}}
const nome=v.nome||'cliente',ks=linhas();let m='Olá, sou '+nome+'. '+Fm.assunto+'\n';
for(const c of Fm.campos){if(c.id!=='nome'&&v[c.id]){m+='\n'+c.rotulo+': '+(c.tipo==='data'?v[c.id].split('-').reverse().join('/'):v[c.id])}}
if(ks.length)m+='\n\n'+(C.pedido?C.pedido.rotulo:'Itens')+':\n'+msgLista(ks).l;
const u=wa(m);$('st').textContent='Abrindo o WhatsApp...';if(!window.open(u,'_blank','noopener'))$('st').innerHTML='Janela bloqueada. <a href="'+u+'">Toque aqui para abrir o WhatsApp</a>.'}}
if(hasP){const ks=Object.keys(PRESETS);$('demo').hidden=false;document.body.classList.add('dm');$('seg').innerHTML=ks.map(k=>'<option value="'+k+'">'+e(PRESETS[k].label)+'</option>').join('');$('seg').onchange=()=>{render(PRESETS[$('seg').value]);window.scrollTo(0,0)};render(PRESETS[ks[0]])}else render(CONFIG);
</script></body></html>
