<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEXO Gestão | Protótipo do painel</title>
<style>
[hidden]{display:none!important}
:root{--ac:#a36a0a;--on:#fff;--bg:#faf8f4;--sf:#fff;--ln:#e2ded5;--fg:#16161a;--mut:#5f5f66;--tint:#f6ecd9;--ok:#2f6b3a;--bad:#a63d2f;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--ac:#e3a43a;--on:#1a1206;--bg:#141416;--sf:#1d1d21;--ln:#34343a;--fg:#f2f1ee;--mut:#a7a6a2;--tint:#2a2418;--ok:#7bc58a;--bad:#e58a7c;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;grid-template-columns:240px 1fr;min-height:100vh}
h1,h2,h3{margin:0;letter-spacing:-.02em;line-height:1.15}p{margin:0}
aside{background:var(--sf);border-right:1px solid var(--ln);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;overflow:auto}
.logo{font-weight:800;font-size:24px;font-style:italic;letter-spacing:.14em;padding:4px 10px 2px;background:linear-gradient(100deg,var(--fg) 38%,#f2b53c 47%,#fff3c4 50%,#f2b53c 53%,var(--fg) 62%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:nxs 6s ease-in-out infinite}
@keyframes nxs{0%{background-position:130% 0}60%,100%{background-position:-30% 0}}
@media(prefers-reduced-motion:reduce){.logo{animation:none;background-position:50% 0}}.sub{font-size:12px;color:var(--mut);padding:0 10px 14px;letter-spacing:.06em;text-transform:uppercase}
aside button{all:unset;cursor:pointer;padding:10px 12px;border-radius:10px;color:var(--mut);display:flex;justify-content:space-between;gap:8px;font-size:15px}
aside button:hover{background:var(--tint);color:var(--fg)}aside button[aria-current=page]{background:var(--tint);color:var(--fg);font-weight:700}aside button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.bg{background:var(--ac);color:var(--on);border-radius:999px;font-size:12px;padding:0 8px;font-weight:700}
.note{margin-top:auto;font-size:12px;color:var(--mut);border:1px dashed var(--ln);border-radius:10px;padding:10px}
main{padding:28px clamp(16px,3vw,40px) 60px;min-width:0}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:end;margin-bottom:22px}.top h1{font-size:30px}.top p{color:var(--mut)}
.btn{font:700 14px system-ui,sans-serif;background:var(--ac);color:var(--on);border:0;border-radius:999px;padding:10px 18px;cursor:pointer}.btn.g{background:none;color:var(--fg);border:1px solid var(--ln)}.btn.s{padding:6px 12px;font-size:13px}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:18px}
.kp b{display:block;font-size:30px;letter-spacing:-.02em}.kp span{color:var(--mut);font-size:14px}
.row2{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}.card h2{font-size:18px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:15px}th{text-align:left;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;padding:8px 10px;border-bottom:1px solid var(--ln)}td{padding:11px 10px;border-bottom:1px solid var(--ln);vertical-align:middle}tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--tint)}.pill.ok{color:var(--ok)}.pill.bad{color:var(--bad)}
.kb{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}.col{background:var(--tint);border-radius:14px;padding:12px;display:grid;gap:10px;align-content:start;min-height:200px}.col h3{font-size:14px;display:flex;justify-content:space-between}
.lead{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px;display:grid;gap:6px}.lead small{color:var(--mut)}.lead div{display:flex;gap:6px;flex-wrap:wrap}
.bar{height:8px;background:var(--ln);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
form.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px;align-items:end}label{font-size:13px;color:var(--mut);display:grid;gap:4px}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px;min-height:42px;width:100%}
.mr{display:flex;align-items:end;gap:6px;height:120px;margin-top:6px}.mr div{flex:1;display:grid;gap:4px;align-content:end;justify-items:center;font-size:11px;color:var(--mut);height:100%}.mr i{display:block;width:100%;background:var(--ac);border-radius:6px 6px 0 0;min-height:4px}
.empty{color:var(--mut);padding:14px 0}
@media(max-width:1000px){body{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--ln)}.logo,.sub{width:100%}.note{display:none}.kp{grid-template-columns:1fr 1fr}.row2{grid-template-columns:1fr}}
@media(max-width:560px){.kp{grid-template-columns:1fr}}
.logo{animation:none;background:none;-webkit-text-fill-color:initial;padding:0;margin:4px 0 6px;height:30px;width:auto;aspect-ratio:568/78;fill:currentColor;color:var(--fg);display:block;font-style:normal}
</style>
</head>

<p class="note">Protótipo conceitual com dados fictícios. Nada é salvo: ao recarregar a página, os dados voltam ao início. A versão real terá login, banco de dados e permissões.</p>
</aside>
<main id="m" tabindex="-1"></main>
<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=v=>Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const ETAPAS=['Lead','Proposta','Contrato','Produção','Entregue'];
const D={
 clientes:[{id:1,nome:'Galeria Exemplo',tipo:'Galeria comercial',contato:'Marta (administração)',status:'Ativo'},{id:2,nome:'Moda Viva',tipo:'Loja',contato:'Carlos',status:'Ativo'},{id:3,nome:'Espaço Recanto',tipo:'Espaço de lazer',contato:'Joana',status:'Ativo'},{id:4,nome:'Auto Center Silva',tipo:'Oficina',contato:'Paulo',status:'Em prospecção'}],
 oport:[{id:1,cli:'Galeria Exemplo',srv:'Site de galeria',val:4800,etapa:'Produção'},{id:2,cli:'Moda Viva',srv:'Site + catálogo',val:1900,etapa:'Contrato'},{id:3,cli:'Espaço Recanto',srv:'Site de espaço',val:1500,etapa:'Proposta'},{id:4,cli:'Auto Center Silva',srv:'Site + Google',val:1200,etapa:'Lead'},{id:5,cli:'Studio Bela',srv:'Placa Google QR/NFC',val:350,etapa:'Lead'}],
 props:[{id:'P-001',cli:'Espaço Recanto',srv:'Site de espaço de lazer',val:1500,status:'Enviada'},{id:'P-002',cli:'Moda Viva',srv:'Site + catálogo',val:1900,status:'Aprovada'},{id:'P-003',cli:'Galeria Exemplo',srv:'Site de galeria',val:4800,status:'Aprovada'}],
 contr:[{id:'C-001',cli:'Galeria Exemplo',vig:'12 meses',mens:290,status:'Vigente'},{id:'C-002',cli:'Moda Viva',vig:'Projeto',mens:0,status:'Aguardando assinatura'}],
 proj:[{id:1,nome:'Site da Galeria Exemplo',cli:'Galeria Exemplo',prazo:'30/11/2026',prog:60,etapa:'Desenvolvimento'},{id:2,nome:'Site e catálogo Moda Viva',cli:'Moda Viva',prazo:'15/12/2026',prog:15,etapa:'Design e protótipo'}],
 fin:[{id:1,cli:'Galeria Exemplo',desc:'Entrada do projeto (50%)',val:2400,venc:'05/10/2026',status:'Recebido'},{id:2,cli:'Galeria Exemplo',desc:'Saldo do projeto (50%)',val:2400,venc:'30/11/2026',status:'A receber'},{id:3,cli:'Galeria Exemplo',desc:'Manutenção mensal',val:290,venc:'10/11/2026',status:'A receber'},{id:4,cli:'Moda Viva',desc:'Entrada do projeto (50%)',val:950,venc:'01/10/2026',status:'Atrasado'}],
 srvs:[{id:1,cli:'Galeria Exemplo',srv:'Hospedagem e manutenção',dom:'galeriaexemplo.com.br',venc:'10/11/2026',mens:290,status:'Ativo'},{id:2,cli:'Moda Viva',srv:'Atualização de catálogo',dom:'modaviva.com.br',venc:'—',mens:0,status:'Aguardando início'}]
};
const V={
'Visão geral':()=>{const ativos=D.clientes.filter(c=>c.status==='Ativo').length,prod=D.proj.length,abertas=D.props.filter(p=>p.status==='Enviada').length,rec=D.srvs.filter(s=>s.status==='Ativo').reduce((a,s)=>a+s.mens,0),rb=D.fin.filter(f=>f.status==='Recebido').reduce((a,f)=>a+f.val,0),ar=D.fin.filter(f=>f.status!=='Recebido').reduce((a,f)=>a+f.val,0);
 return head('Visão geral','Resumo da operação da NEXO.')+`<div class="kp"><div class="card"><b>${ativos}</b><span>Clientes ativos</span></div><div class="card"><b>${prod}</b><span>Projetos em execução</span></div><div class="card"><b>${abertas}</b><span>Propostas abertas</span></div><div class="card"><b>${brl(rec)}</b><span>Receita recorrente mensal</span></div></div>
 <div class="row2"><div class="card"><h2>Funil comercial</h2>${ETAPAS.map(e=>{const n=D.oport.filter(o=>o.etapa===e).length,t=Math.max(1,D.oport.length);return `<p style="display:flex;justify-content:space-between;font-size:14px"><span>${e}</span><b>${n}</b></p><div class="bar" style="margin-bottom:10px"><i style="width:${n/t*100}%"></i></div>`}).join('')}</div>
 <div class="card"><h2>Financeiro</h2><p>Recebido: <b>${brl(rb)}</b></p><p>A receber / atrasado: <b>${brl(ar)}</b></p><h2 style="margin-top:16px">Atenção</h2>${D.fin.filter(f=>f.status==='Atrasado').map(f=>`<p><span class="pill bad">Atrasado</span> ${esc(f.cli)}: ${esc(f.desc)}</p>`).join('')||'<p class="empty">Nada atrasado.</p>'}${D.contr.filter(c=>c.status!=='Vigente').map(c=>`<p style="margin-top:6px"><span class="pill">Pendente</span> ${esc(c.id)} ${esc(c.status.toLowerCase())}</p>`).join('')}</div></div>`},
'Clientes':()=>head('Clientes','Cadastro único: os outros módulos reutilizam estes dados.')+`<form class="f card" id="fc"><label>Nome<input id="cn" required></label><label>Tipo<select id="ct"><option>Loja</option><option>Galeria comercial</option><option>Espaço de lazer</option><option>Empresa</option><option>Negócio local</option></select></label><label>Contato<input id="cc"></label><button class="btn">Adicionar cliente</button></form>`+tbl(['Cliente','Tipo','Contato','Status'],D.clientes.map(c=>[esc(c.nome),esc(c.tipo),esc(c.contato),pill(c.status)])),
'CRM':()=>head('CRM e funil','Mova cada oportunidade entre as etapas.')+`<div class="kb">${ETAPAS.map((e,i)=>`<div class="col"><h3>${e}<span class="bg">${D.oport.filter(o=>o.etapa===e).length}</span></h3>${D.oport.filter(o=>o.etapa===e).map(o=>`<div class="lead"><b>${esc(o.cli)}</b><small>${esc(o.srv)} · ${brl(o.val)}</small><div>${i>0?`<button class="btn g s" data-o="${o.id}" data-d="-1" aria-label="Voltar ${esc(o.cli)}">←</button>`:''}${i<4?`<button class="btn s" data-o="${o.id}" data-d="1" aria-label="Avançar ${esc(o.cli)}">→</button>`:''}</div></div>`).join('')||'<p class="empty">Vazio</p>'}</div>`).join('')}</div>`,
'Propostas':()=>head('Propostas','Escopo, valor e aprovação.')+tbl(['Nº','Cliente','Serviço','Valor','Status'],D.props.map(p=>[p.id,esc(p.cli),esc(p.srv),brl(p.val),pill(p.status)])),
'Contratos':()=>head('Contratos','Vigência, status e renovação. Assinatura eletrônica poderá ser integrada depois.')+tbl(['Nº','Cliente','Vigência','Mensalidade','Status'],D.contr.map(c=>[c.id,esc(c.cli),esc(c.vig),c.mens?brl(c.mens):'—',pill(c.status)])),
'Projetos':()=>head('Projetos','Etapas, prazos e entregas.')+`<div class="row2" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">${D.proj.map(p=>`<div class="card"><h2>${esc(p.nome)}</h2><p style="color:var(--mut)">${esc(p.cli)} · prazo ${esc(p.prazo)}</p><p style="margin:10px 0 6px">${esc(p.etapa)} · <b>${p.prog}%</b></p><div class="bar"><i style="width:${p.prog}%"></i></div><p style="margin-top:12px"><button class="btn g s" data-pg="${p.id}">+10%</button></p></div>`).join('')}</div>`,
'Financeiro':()=>head('Financeiro','Valores contratados, recebimentos e pendências.')+tbl(['Cliente','Descrição','Valor','Vencimento','Status',''],D.fin.map(f=>[esc(f.cli),esc(f.desc),brl(f.val),esc(f.venc),pill(f.status),f.status!=='Recebido'?`<button class="btn s" data-rc="${f.id}">Marcar recebido</button>`:''])),
'Serviços':()=>head('Serviços recorrentes','Hospedagem, domínio, suporte e manutenção.')+tbl(['Cliente','Serviço','Domínio','Próx. vencimento','Mensalidade','Status'],D.srvs.map(s=>[esc(s.cli),esc(s.srv),esc(s.dom),esc(s.venc),s.mens?brl(s.mens):'—',pill(s.status)])),
'Indicadores':()=>{const tot=D.oport.length,fech=D.oport.filter(o=>['Contrato','Produção','Entregue'].includes(o.etapa)).length,pot=D.oport.reduce((a,o)=>a+o.val,0),by={};D.oport.forEach(o=>by[o.srv]=(by[o.srv]||0)+o.val);const mx=Math.max(...Object.values(by));
 return head('Indicadores','Calculados a partir dos dados acima.')+`<div class="kp"><div class="card"><b>${tot?Math.round(fech/tot*100):0}%</b><span>Conversão em contrato</span></div><div class="card"><b>${brl(pot)}</b><span>Valor no funil</span></div><div class="card"><b>${brl(D.srvs.filter(s=>s.status==='Ativo').reduce((a,s)=>a+s.mens,0))}</b><span>Recorrência mensal</span></div><div class="card"><b>${D.clientes.length}</b><span>Clientes cadastrados</span></div></div><div class="card"><h2>Valor por serviço</h2><div class="mr">${Object.entries(by).map(([k,v])=>`<div title="${esc(k)}"><i style="height:${v/mx*90}px"></i><span>${esc(k.split(' ')[0])}</span></div>`).join('')}</div></div>`}
};
const pill=s=>`<span class="pill ${/Ativo|Vigente|Aprovada|Recebido/.test(s)?'ok':/Atrasado/.test(s)?'bad':''}">${esc(s)}</span>`;
const head=(t,p)=>`<div class="top"><div><h1>${t}</h1><p>${p}</p></div></div>`;
const tbl=(h,r)=>`<div class="card tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.map(l=>`<tr>${l.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
let cur='Visão geral';
function go(v){cur=v;$('#nav').innerHTML=Object.keys(V).map(k=>`<button type="button" ${k===cur?'aria-current="page"':''} data-v="${k}">${k}${k==='CRM'?`<span class="bg">${D.oport.filter(o=>o.etapa==='Lead').length}</span>`:''}</button>`).join('');$('#m').innerHTML=V[cur]();bind()}
function bind(){document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
 document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const o=D.oport.find(x=>x.id==b.dataset.o);o.etapa=ETAPAS[ETAPAS.indexOf(o.etapa)+ +b.dataset.d];go('CRM')});
 document.querySelectorAll('[data-pg]').forEach(b=>b.onclick=()=>{const p=D.proj.find(x=>x.id==b.dataset.pg);p.prog=Math.min(100,p.prog+10);go('Projetos')});
 document.querySelectorAll('[data-rc]').forEach(b=>b.onclick=()=>{D.fin.find(x=>x.id==b.dataset.rc).status='Recebido';go('Financeiro')});
 const f=$('#fc');if(f)f.onsubmit=ev=>{ev.preventDefault();const n=$('#cn').value.trim();if(!n)return;D.clientes.push({id:Date.now(),nome:n,tipo:$('#ct').value,contato:$('#cc').value.trim()||'—',status:'Em prospecção'});go('Clientes')}}
go(cur);
</script>
